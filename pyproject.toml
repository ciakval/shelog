[project]
name = "shelog"
version = "0.1.0"
description = "Shelly Cloud climate logger for a drying subfloor"
requires-python = ">=3.13"
dependencies = [
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
shelog = "shelog.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".planning"]  # ruff 0.17 would otherwise reformat markdown code blocks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
